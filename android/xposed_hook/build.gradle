plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.mockgps.hook'
    compileSdk 34

    defaultConfig {
        applicationId "com.mockgps.hook"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        buildConfig true
    }
}

dependencies {
    // Xposed API，仅编译时引用，不打包进 APK（由 LSPosed 框架提供）
    compileOnly 'de.robv.android.xposed:api:82'
}
